# Keep Gradle below the available native-memory budget on this 15 GB machine.
# The previous 3 GB heap and unrestricted worker count crashed the JVM during dexing.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
android.useAndroidX=true
# Kotlin daemon crashes computing relative paths between the pub-cache (C:) and
# this project (D:) on Windows — see "different roots" IllegalArgumentException.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
